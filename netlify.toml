# Konfigurasi deploy Netlify (situs statis + 1 serverless function)
# Aplikasi utamanya frontend statis — backend Node (server.js) tidak
# ikut, jadi data bidang tersimpan di browser tiap pengunjung (localStorage).
# Satu pengecualian: netlify/functions/sync-to-drive.js — serverless
# function untuk sinkronisasi foto/data ke Google Drive (Service Account).

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Header keamanan + caching (membantu skor Lighthouse Best Practices/SEO)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
for = "/css/*"
[headers.values]
  # Jangan immutable 1 tahun: update aplikasi tidak sampai ke pengguna.
  # Caching offline ditangani service worker, HTTP hanya revalidate.
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/js/*"
[headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Service worker harus selalu segar agar update aplikasi cepat sampai ke pengguna
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Frontend memanggil /api/sync-to-drive (sama seperti path di server.js lokal);
# di Netlify, arahkan ke serverless function yang setara.
[[redirects]]
  from = "/api/sync-to-drive"
  to = "/.netlify/functions/sync-to-drive"
  status = 200

